title: Bioh Park Blog
description: "Bioh Park의 개인 실험실 · 만든 것들을 페이지 단위로 올립니다"
baseurl: ""
url: "https://biohpark.github.io"

theme: minima   # 깔끔한 기본 테마

# 상단 네비게이션 (minima)
header_pages:
  - pages/about.md
  - pages/playground.md

# 빌드 산출물·로컬 도구는 사이트에 포함하지 않는다
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
