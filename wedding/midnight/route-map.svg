<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 230" role="img" aria-labelledby="routeTitle routeDesc">
  <title id="routeTitle">티웨딩 천안 오시는 길 안내도</title>
  <desc id="routeDesc">천안IC, 천안JC, 권장 경로인 남천안IC와 독립기념관IC, 티웨딩 천안 및 다섯 곳의 주변 랜드마크를 공식 약도 배치에 따라 표시한 축척 없는 안내도입니다.</desc>
  <rect width="345" height="230" rx="8" fill="#f7f3ea"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 92 C71 98 112 88 158 91 C216 91 269 102 334 123" stroke="#adb1b4" stroke-width="8"/>
    <path d="M14 92 C71 98 112 88 158 91 C216 91 269 102 334 123" stroke="#f7f3ea" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M149 34 C150 69 155 112 158 152 C142 178 122 205 105 230" stroke="#111820" stroke-width="5"/>
    <path d="M158 152 C212 151 282 166 352 184" stroke="#111820" stroke-width="5"/>
    <path d="M160 137 L180 122" stroke="#111820" stroke-width="2.5"/>
    <path d="M271 103 C290 119 309 137 318 153 C309 169 295 183 285 196" stroke="#92989c" stroke-width="3.5"/>
  </g>

  <g font-family="'Noto Serif KR','Malgun Gothic',sans-serif" font-size="12">
    <text x="14" y="84" fill="#40464b">←천안아산역</text>

    <g data-ic-badge="cheonan">
      <rect x="117" y="12" width="66" height="22" rx="2" fill="#eef0ed" stroke="#7d8790" stroke-width="1.5"/>
      <text x="150" y="27" text-anchor="middle" fill="#59616a">천안IC</text>
    </g>
    <g data-ic-badge="junction">
      <rect x="87" y="154" width="72" height="22" rx="2" fill="#788396"/>
      <text x="123" y="169" text-anchor="middle" fill="#fff">천안JC</text>
    </g>
    <g data-ic-badge="south" data-recommended="true">
      <rect x="39" y="196" width="78" height="22" rx="2" fill="#b08a3c" stroke="#765a24" stroke-width="1.5"/>
      <text x="78" y="211" text-anchor="middle" fill="#fff">남천안IC</text>
    </g>
    <g data-ic-badge="independence" data-recommended="true">
      <rect x="237" y="196" width="96" height="22" rx="2" fill="#b08a3c" stroke="#765a24" stroke-width="1.5"/>
      <text x="285" y="211" text-anchor="middle" fill="#fff">독립기념관IC</text>
    </g>

    <text x="190" y="20" fill="#59616a">천안IC보다</text>
    <text x="190" y="36" fill="#a4332e" font-weight="700">독립기념관IC, 남천안IC를</text>
    <text x="190" y="52" fill="#31363a">이용하시면 더욱 편리합니다</text>

    <g data-destination="venue" transform="translate(194 106)">
      <path d="M-22 -30 H22 V1 H-22 Z" fill="#fff" stroke="#777" stroke-width="1.5"/>
      <path d="M-7 -30 V-38 H7 V-30" fill="#fff" stroke="#777" stroke-width="1.5"/>
      <text x="0" y="-17" text-anchor="middle" fill="#222" font-size="15" font-weight="700">티웨딩</text>
      <text x="0" y="-2" text-anchor="middle" fill="#222" font-size="15" font-weight="700">천안</text>
      <path d="M-10 4 V23 H10 V4 M-14 4 H14 M-8 4 V-4 L-2 1 L4 -6 L10 1 L15 -4 V23 H-15 V-4 Z" fill="#4c4b49"/>
      <rect x="-3" y="13" width="6" height="10" rx="3" fill="#f7f3ea"/>
    </g>

    <g data-landmark="hospital">
      <circle cx="135" cy="121" r="4" fill="#1f252a"/>
      <text x="124" y="117" text-anchor="end" fill="#30363a">천안의료원</text>
    </g>
    <g data-landmark="apartment">
      <circle cx="222" cy="139" r="4" fill="#1f252a"/>
      <text x="233" y="143" fill="#30363a">세광 엔리치빌 APT</text>
    </g>
    <g data-landmark="booyoung">
      <circle cx="151" cy="187" r="4" fill="#1f252a"/>
      <text x="162" y="191" fill="#30363a">부영아파트</text>
    </g>
    <g data-landmark="independence-hall">
      <circle cx="312" cy="101" r="4" fill="#1f252a"/>
      <text x="301" y="97" text-anchor="end" fill="#30363a">독립기념관</text>
    </g>
    <g data-landmark="tollgate">
      <circle cx="318" cy="153" r="4" fill="#1f252a"/>
      <text x="307" y="169" text-anchor="end" fill="#30363a">독립기념관 톨게이트</text>
    </g>
  </g>
</svg>
