<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 220" role="img" aria-labelledby="title desc">
  <title id="title">티웨딩 천안 공식 카드 기반 안내도</title>
  <desc id="desc">목천IC, 천안JC, 남천안IC, 천안IC 도로 분기와 티웨딩 천안 및 주변 랜드마크의 관계를 단순화한 모식 안내도입니다.</desc>
  <rect width="428" height="220" rx="8" fill="#f0e4cf"/>

  <g data-road="highway" fill="none" stroke="#0c1528" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M31 92 H153 C182 92 194 106 220 121"/>
    <path d="M220 121 C266 101 308 58 365 24"/>
    <path d="M220 121 C267 139 312 164 363 181"/>
  </g>
  <g data-road="local" fill="none" stroke="#a9a49b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 114 C217 101 223 89 230 75 C247 61 274 50 310 44"/>
  </g>
  <g data-recommended-routes="true" fill="none" stroke="#c1a261" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path data-route="recommended" d="M365 24 C308 58 266 101 220 121 L214 114 C217 101 223 89 230 75"/>
    <path data-route="recommended" d="M363 181 C312 164 267 139 220 121 L214 114 C217 101 223 89 230 75"/>
  </g>

  <g data-landmarks="true" fill="#77736c" font-family="Batang, serif" font-size="10" text-anchor="middle">
    <g data-landmark="천안삼거리 가구단지">
      <circle cx="79" cy="47" r="3.5" fill="#a9a49b"/>
      <text x="79" y="62">천안삼거리 가구단지</text>
    </g>
    <g data-landmark="천안의료원">
      <circle cx="77" cy="137" r="3.5" fill="#a9a49b"/>
      <text x="77" y="152">천안의료원</text>
    </g>
    <g data-landmark="천안박물관">
      <circle cx="126" cy="174" r="3.5" fill="#a9a49b"/>
      <text x="126" y="165">천안박물관</text>
    </g>
    <g data-landmark="부영아파트">
      <circle cx="247" cy="171" r="3.5" fill="#a9a49b"/>
      <text x="247" y="187">부영아파트</text>
    </g>
    <g data-landmark="세광엔리치빌 APT">
      <circle cx="328" cy="58" r="3.5" fill="#a9a49b"/>
      <text x="328" y="73">세광엔리치빌 APT</text>
    </g>
  </g>

  <g data-destination="true" transform="translate(226 78)" font-family="Batang, serif" text-anchor="middle">
    <path data-destination-border="outer" d="M0 -38 L56 0 L0 38 L-56 0 Z" fill="#6a2634" stroke="#c1a261" stroke-width="5"/>
    <path data-destination-border="inner" d="M0 -31 L46 0 L0 31 L-46 0 Z" fill="none" stroke="#c1a261" stroke-width="2"/>
    <text y="-2" fill="#f0e4cf" font-size="11" font-weight="700">티웨딩 천안</text>
    <text y="13" fill="#f0e4cf" font-size="10">투데이홀</text>
  </g>

  <g data-ic-badge="true" font-family="Batang, serif" font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="7" y="73" width="54" height="24" rx="4" fill="#1f4d7a" stroke="#f0e4cf"/>
    <text x="34" y="89" fill="#fff">천안IC</text>
  </g>
  <g data-ic-badge="true" font-family="Batang, serif" font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="190" y="126" width="60" height="24" rx="4" fill="#1f4d7a" stroke="#f0e4cf"/>
    <text x="220" y="142" fill="#fff">천안JC</text>
  </g>
  <g data-ic-badge="true" font-family="Batang, serif" font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="330" y="7" width="64" height="24" rx="4" fill="#1f4d7a" stroke="#f0e4cf"/>
    <text x="362" y="23" fill="#fff">목천IC</text>
  </g>
  <g data-ic-badge="true" font-family="Batang, serif" font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="325" y="168" width="74" height="24" rx="4" fill="#1f4d7a" stroke="#f0e4cf"/>
    <text x="362" y="184" fill="#fff">남천안IC</text>
  </g>

  <g data-north-arrow="true" transform="translate(411 52)" fill="#0c1528" stroke="#0c1528" stroke-linecap="round">
    <text x="0" y="-24" font-family="Georgia, serif" font-size="10.5" font-weight="700" text-anchor="middle" stroke="none">N</text>
    <path d="M0 -18 V5" fill="none" stroke-width="2"/>
    <path d="M0 -18 L-5 -9 H5 Z" stroke="none"/>
  </g>

  <rect x="0" y="198" width="428" height="22" fill="#0c1528"/>
  <text x="214" y="213" fill="#f0e4cf" font-family="Batang, serif" font-size="10.5" text-anchor="middle">천안IC보다 목천IC, 남천안IC를 이용하시면 더욱 편리합니다</text>
</svg>
